# This workflow will generate the docs on each push, and publish them on GitHub Pages if the branch is the main one.
name: main

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for full commit history
          persist-credentials: false

      - name: Restore file modification times
        uses: chetan/git-restore-mtime-action@v2

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      - name: Set up Lilypond
        uses: codello/setup-lilypond@main
        with:
          lilypond-version: 2.24

      - name: Set up venv
        run: |
          uv sync

      - name: Compile files
        run: |
          mkdir ~/.fonts
          cp ./lilypond/utils/lilyjazzchord.otf ~/.fonts/
          uv run deploy.py

      - name: Setup Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
